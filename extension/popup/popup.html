<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chess FEN-tastic</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <span class="icon">♟️</span>
        <span class="title">Chess FEN-tastic</span>
      </div>
      <button id="settingsBtn" class="btn-icon" title="Settings">⚙️</button>
    </header>

    <main class="content">
      <button id="captureBtn" class="btn-primary">
        <span class="btn-icon-label">📸</span>
        <span class="btn-text">Capture Chessboard</span>
        <span class="btn-badge">Alt+Shift+C</span>
      </button>

      <div id="statusBox" class="status-box status-idle">
        <div id="statusSpinner" class="spinner" style="display: none;"></div>
        <span id="statusMessage">Click Capture or press Alt+Shift+C to select a chessboard.</span>
      </div>

      <div id="resultContainer" class="result-container" style="display: none;">
        <div class="result-header">
          <span class="section-label">Generated FEN</span>
          <div class="badges-row">
            <span id="verificationBadge" class="badge badge-verified">VERIFIED</span>
            <span id="validBadge" class="badge badge-success">VALID FEN</span>
          </div>
        </div>

        <div id="verificationMsg" class="verification-msg" style="display: none;"></div>

        <div class="fen-box">
          <textarea id="fenOutput" readonly rows="2"></textarea>
          <button id="copyFenBtn" class="btn-copy" title="Copy to clipboard">📋 Copy</button>
        </div>

        <!-- Interactive Board Preview & Square Editor -->
        <div id="boardPreviewSection" class="board-preview-section" style="display: none;">
          <div class="board-header-row">
            <span class="section-label">Board Preview & Editor</span>
            <span id="confidenceLabel" class="confidence-label">Confidence: 100%</span>
          </div>
          <div class="chessboard-wrapper">
            <div id="chessBoardGrid" class="chessboard-grid"></div>
          </div>
          <div class="board-hint">Click any square to inspect or adjust piece</div>
        </div>

        <!-- Piece Selector Popover -->
        <div id="piecePickerPopover" class="piece-picker-popover" style="display: none;">
          <div class="picker-header">
            <span id="pickerSquareName">Square e4</span>
            <button id="closePickerBtn" class="picker-close" type="button">&times;</button>
          </div>
          <div class="picker-row">
            <button type="button" class="picker-piece" data-piece="empty" title="Empty Square">∅ (Empty)</button>
          </div>
          <div class="picker-row white-pieces">
            <button type="button" class="picker-piece" data-piece="white_king" title="White King">♔</button>
            <button type="button" class="picker-piece" data-piece="white_queen" title="White Queen">♕</button>
            <button type="button" class="picker-piece" data-piece="white_rook" title="White Rook">♖</button>
            <button type="button" class="picker-piece" data-piece="white_bishop" title="White Bishop">♗</button>
            <button type="button" class="picker-piece" data-piece="white_knight" title="White Knight">♘</button>
            <button type="button" class="picker-piece" data-piece="white_pawn" title="White Pawn">♙</button>
          </div>
          <div class="picker-row black-pieces">
            <button type="button" class="picker-piece" data-piece="black_king" title="Black King">♚</button>
            <button type="button" class="picker-piece" data-piece="black_queen" title="Black Queen">♛</button>
            <button type="button" class="picker-piece" data-piece="black_rook" title="Black Rook">♜</button>
            <button type="button" class="picker-piece" data-piece="black_bishop" title="Black Bishop">♝</button>
            <button type="button" class="picker-piece" data-piece="black_knight" title="Black Knight">♞</button>
            <button type="button" class="picker-piece" data-piece="black_pawn" title="Black Pawn">♟</button>
          </div>
        </div>

        <div class="action-buttons">
          <button id="openLichessBtn" class="btn-secondary">
            <span>♟️ Lichess</span>
          </button>
          <button id="openChessComBtn" class="btn-secondary">
            <span>⚔️ Chess.com</span>
          </button>
        </div>

        <div id="previewWrapper" class="preview-wrapper" style="display: none;">
          <span class="section-label">Captured Screenshot</span>
          <img id="previewImage" alt="Cropped Board Preview">
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
